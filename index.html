<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>高等数学互动教学：偏导数的几何意义 | 曲面切片与切线</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', 'Segoe UI', 'Roboto', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 5px solid #ff3366;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 25px;
            right: 25px;
            background: rgba(30,30,40,0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            color: white;
            z-index: 100;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: auto;
            font-size: 16px;
        }
        .control-group {
            flex: 1;
            min-width: 180px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .control-group span {
            color: #ffaa66;
            font-weight: bold;
        }
        input {
            width: 100%;
            cursor: pointer;
            background: #3a6ea5;
            height: 4px;
            border-radius: 5px;
        }
        .formula {
            font-family: monospace;
            font-size: 18px;
            background: #000000aa;
            padding: 5px 12px;
            border-radius: 40px;
            letter-spacing: 1px;
        }
        @media (max-width: 700px) {
            .control-group { font-size: 12px; }
            .formula { font-size: 12px; }
        }
        .note {
            font-size: 12px;
            color: #ccc;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="info">
        🧠 <strong>偏导数 ∂z/∂x 的几何意义</strong> ：固定 y = <span id="yValDisplay">0.0</span> ，曲面交得一条曲线，<br>
        该曲线上点 x = <span id="xValDisplay">0.0</span> 处的切线斜率 = <span id="slopeDisplay" style="color:#ffaa66;">0.00</span> &nbsp;&nbsp; | &nbsp; 函数: z = x² − y²
    </div>
    <div id="controls">
        <div class="control-group">
            <label>📐 切片位置 (固定 y): <span id="ySliderVal">0.00</span></label>
            <input type="range" id="ySlice" min="-1.8" max="1.8" step="0.01" value="0.8">
        </div>
        <div class="control-group">
            <label>📍 切点位置 (x₀): <span id="xPointVal">0.00</span></label>
            <input type="range" id="xPoint" min="-1.8" max="1.8" step="0.01" value="1.2">
        </div>
        <div class="formula">
            ∂z/∂x = 2x₀ = <span id="derivativeVal">0.00</span>
        </div>
        <div class="note">
            🖱️ 鼠标拖拽旋转视角 | 滚动缩放
        </div>
    </div>

    <!-- 引入 Three.js 核心库及扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.012);

        // 透视相机 (视角, 宽高比, 近平面, 远平面)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.5, 2.8, 4.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影映射增强质感
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2 渲染文字
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 控制器 (允许用户互动旋转/缩放) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);

        // --- 辅助元素: 网格地面、坐标轴、环境光、定向光 ---
        // 地面网格辅助线 (XZ平面，但是为了视觉在y=-2处)
        const gridHelper = new THREE.GridHelper(8, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -2.2;
        scene.add(gridHelper);
        
        // 简易坐标轴
        const axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);
        
        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.3);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        // --- 核心: 生成曲面网格 (z = x^2 - y^2) ---
        const size = 3.6;   // x, y 范围 [-1.8, 1.8]
        const segments = 64;
        const vertices = [];
        const indices = [];
        const normals = [];
        
        // 存储顶点坐标用于后续动态切片计算复用 (为了性能)
        const gridPoints = [];
        const step = size / segments;
        const start = -size/2;
        
        // 第一遍: 生成顶点位置和法线
        for (let i = 0; i <= segments; i++) {
            const x = start + i * step;
            gridPoints[i] = [];
            for (let j = 0; j <= segments; j++) {
                const y = start + j * step;
                const z = x*x - y*y;
                vertices.push(x, y, z);
                // 计算法线近似 (数值梯度)
                const eps = 0.05;
                const dzdx = ( (x+eps)*(x+eps) - y*y - (x-eps)*(x-eps) + y*y ) / (2*eps);
                const dzdy = ( x*x - (y+eps)*(y+eps) - (x*x - (y-eps)*(y-eps)) ) / (2*eps);
                const nx = -dzdx;
                const ny = -dzdy;
                const nz = 1;
                const len = Math.hypot(nx, ny, nz);
                normals.push(nx/len, ny/len, nz/len);
                gridPoints[i][j] = { x, y, z };
            }
        }
        
        // 构建索引 (两个三角形形成一个矩形)
        for (let i = 0; i < segments; i++) {
            for (let j = 0; j < segments; j++) {
                const a = i * (segments+1) + j;
                const b = (i+1) * (segments+1) + j;
                const c = (i+1) * (segments+1) + (j+1);
                const d = i * (segments+1) + (j+1);
                indices.push(a, b, c);
                indices.push(a, c, d);
            }
        }
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
        geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(normals), 3));
        geometry.setIndex(indices);
        
        // 曲面材质: 半透明青色带光泽
        const material = new THREE.MeshPhongMaterial({
            color: 0x3a86ff,
            side: THREE.DoubleSide,
            emissive: 0x001133,
            shininess: 60,
            transparent: true,
            opacity: 0.75
        });
        const surfaceMesh = new THREE.Mesh(geometry, material);
        scene.add(surfaceMesh);
        
        // 添加边缘轮廓线增强立体感
        const edgesGeo = new THREE.EdgesGeometry(geometry);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x88bbff, linewidth: 1 });
        const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
        scene.add(wireframe);
        
        // --- 动态元素: 切片平面 (透明矩形), 截线, 切线 ---
        let slicePlaneMesh = null;
        let intersectionCurve = null;
        let tangentLineObj = null;
        
        // 辅助函数: 更新所有动态几何 (依赖 y0 和 x0)
        function updateVisuals(y0, x0) {
            // 1. 切片平面: 矩形平面方程 y = y0, 范围 x ∈ [-1.8,1.8], z ∈ [-3, 3]
            if (slicePlaneMesh) scene.remove(slicePlaneMesh);
            const planeWidth = size;
            const planeHeight = 5.5; // z范围足够覆盖曲面
            const planeGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
            const planeMaterial = new THREE.MeshPhongMaterial({
                color: 0xffaa44,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.35,
                emissive: 0x442200
            });
            slicePlaneMesh = new THREE.Mesh(planeGeometry, planeMaterial);
            // 旋转使其面向Y轴方向，原本PlaneGeometry默认法线Z, 需要绕X旋转 Math.PI/2 使其法线为Y
            slicePlaneMesh.rotation.x = Math.PI / 2;
            slicePlaneMesh.position.set(0, y0, 0);
            scene.add(slicePlaneMesh);
            
            // 2. 截线: 参数方程 f(x, y0) -> (x, y0, x^2 - y0^2)
            const pointsCount = 200;
            const pts = [];
            for (let i = 0; i <= pointsCount; i++) {
                const x = -size/2 + (i / pointsCount) * size;
                const z = x*x - y0*y0;
                pts.push(new THREE.Vector3(x, y0, z));
            }
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(pts);
            if (intersectionCurve) scene.remove(intersectionCurve);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xff3366, linewidth: 3 }); // linewidth not supported everywhere, but color works
            intersectionCurve = new THREE.Line(lineGeometry, lineMat);
            scene.add(intersectionCurve);
            
            // 3. 切线: 在点 (x0, y0, x0^2 - y0^2) 处, 斜率 k = 2*x0
            const slope = 2 * x0;
            const z0 = x0*x0 - y0*y0;
            // 切线参数方程 t: 从 x0-1.2 到 x0+1.2 (避免超出边界)
            const tStart = Math.max(-size/2, x0 - 1.2);
            const tEnd = Math.min(size/2, x0 + 1.2);
            const tangentPts = [];
            const stepT = (tEnd - tStart) / 60;
            for (let t = tStart; t <= tEnd + 1e-5; t += stepT) {
                const zTangent = slope * (t - x0) + z0;
                tangentPts.push(new THREE.Vector3(t, y0, zTangent));
            }
            const tangentGeometry = new THREE.BufferGeometry().setFromPoints(tangentPts);
            if (tangentLineObj) scene.remove(tangentLineObj);
            const tangentMat = new THREE.LineBasicMaterial({ color: 0x33ff99, linewidth: 4 });
            tangentLineObj = new THREE.Line(tangentGeometry, tangentMat);
            scene.add(tangentLineObj);
            
            // 添加一个发光小球体标记切点
            if (window.markerPoint) scene.remove(window.markerPoint);
            const sphereGeo = new THREE.SphereGeometry(0.07, 16, 16);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffaa55, emissive: 0x442200 });
            const marker = new THREE.Mesh(sphereGeo, sphereMat);
            marker.position.set(x0, y0, z0);
            scene.add(marker);
            window.markerPoint = marker;
            
            // 更新 HTML 显示内容
            document.getElementById('ySliderVal').innerText = y0.toFixed(2);
            document.getElementById('xPointVal').innerText = x0.toFixed(2);
            document.getElementById('yValDisplay').innerText = y0.toFixed(2);
            document.getElementById('xValDisplay').innerText = x0.toFixed(2);
            const slopeVal = (2 * x0).toFixed(3);
            document.getElementById('slopeDisplay').innerHTML = slopeVal;
            document.getElementById('derivativeVal').innerHTML = slopeVal;
        }
        
        // 初始化UI滑块
        const ySlider = document.getElementById('ySlice');
        const xSlider = document.getElementById('xPoint');
        
        function handleAllUpdates() {
            const y0 = parseFloat(ySlider.value);
            const x0 = parseFloat(xSlider.value);
            updateVisuals(y0, x0);
        }
        
        ySlider.addEventListener('input', handleAllUpdates);
        xSlider.addEventListener('input', handleAllUpdates);
        
        // 添加几个CSS2D文字标签说明关键元素
        function makeLabel(text, color, position) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '18px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0px black';
            div.style.background = 'rgba(0,0,0,0.5)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '20px';
            div.style.borderLeft = `3px solid ${color}`;
            const label = new CSS2DObject(div);
            label.position.copy(position);
            scene.add(label);
        }
        makeLabel('曲面: z = x² − y²', '#88aaff', new THREE.Vector3(1.6, 2.2, 1.5));
        makeLabel('切片平面 (固定 y)', '#ffaa66', new THREE.Vector3(1.3, 1.2, -1.8));
        makeLabel('截线', '#ff6699', new THREE.Vector3(1.2, 0.5, 1.9));
        makeLabel('切线 (斜率 ∂z/∂x)', '#33ff99', new THREE.Vector3(1.4, -0.8, 2.2));
        
        // --- 增加一个简易的光晕效果或背景的星空小球点 (装饰)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 200);
            starPos.push((Math.random() - 0.5) * 100);
            starPos.push((Math.random() - 0.5) * 80 - 40);
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        const starMat = new THREE.PointsMaterial({ color: 0x88aadd, size: 0.08 });
        const stars = new THREE.Points(starGeometry, starMat);
        scene.add(stars);
        
        // 启动默认
        handleAllUpdates();
        
        // --- 简单动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 更新轨道控制
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // 窗口适配
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 小提示: 控制台可输出完成
        console.log('✅ 3D 偏导数教学场景已启动 | 函数 z = x² - y²');
    </script>
</body>
</html>
